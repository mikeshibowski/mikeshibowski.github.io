<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mike Shibowski</title>
    <meta name="description" content="Mike Shibowski: ML developer.">
    <meta property="og:title" content="Mike Shibowski">
    <meta property="og:description" content="ML developer.">
    <meta property="og:url" content="https://mikeshibowski.github.io/">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: dark;
            --bg: #0d0d0d;
            --text: #e0e0e0;
            --muted: #a3a3a3;
        }

        body {
            font-family: 'Fira Code', ui-monospace, monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 16px;
        }

        .container {
            max-width: 520px;
            width: 100%;
        }

        .name {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .tagline {
            color: var(--muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="name">Mike Shibowski</h1>
        <p class="tagline">ML developer</p>
    </div>
</body>
</html>
